[package]
name = "ot-tracker"
version = "0.1.0"
description = "OT Management & Tracker for macOS"
authors = ["DIP"]
edition = "2021"

[lib]
name = "ot_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ot-tracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
