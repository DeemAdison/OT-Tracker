name: "Build Windows Installer (Tauri)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OT Tracker v__VERSION__"
          releaseBody: "Release for Windows (.exe / .msi)"
          releaseDraft: true
          prerelease: false
          args: --ignore-version-mismatches

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OT-Tracker-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
