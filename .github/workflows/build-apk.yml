name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OT_Tracker_Android_APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release & Attach APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OT Tracker Android APK (Build ${{ github.run_number }})"
          body: |
            ### 📱 OT Tracker สำหรับ Android (.apk)
            - ไฟล์ติดตั้ง APK พร้อมใช้งานสำหรับมือถือ Android
            - สามารถดาวน์โหลดไฟล์ `app-debug.apk` ด้านล่างไปติดตั้งบนมือถือได้ทันที
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
