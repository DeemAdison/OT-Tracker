name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OT_Tracker_Android_APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release & Attach APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OT Tracker Android APK (Build ${{ github.run_number }})"
          body: |
            ### 📱 OT Tracker สำหรับ Android (.apk)
            - ไฟล์ติดตั้ง APK พร้อมใช้งานสำหรับมือถือ Android
            - รองรับ Android 7.0 (API 24) ถึง Android 14+ (API 34)
            - ใช้งานได้แบบออฟไลน์ 100%
            - สามารถดาวน์โหลดไฟล์ `app-debug.apk` ด้านล่างไปติดตั้งบนมือถือได้ทันที
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
